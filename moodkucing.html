<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>

  <title>Mood Kamu Hari Ini (Kucing Style)</title>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #fffaf0; padding: 50px; }
    h1 { color: #ff69b4; }
    img { width: 300px; border-radius: 20px; margin: 20px auto; }
    button { padding: 12px 24px; font-size: 16px; background-color: #ff69b4; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #mood { font-size: 1.2em; color: #444; margin-top: 20px; }
  </style>
</head>
<body>

  <div id="mood">Klik tombol di bawah buat tahu mood kamu hari ini!</div>
  <br><br>
  <button onclick="generateMood()">Lihat Mood Aku 😼</button>

      const mood = moods[Math.floor(Math.random() * moods.length)];
      document.getElementById("mood").innerText = mood;
      document.getElementById("catImg").src = "https://cataas.com/cat?time=" + new Date().getTime();

</body>
</html>
